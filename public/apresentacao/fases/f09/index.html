<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jogo GPU — FPS Retrô (WebGPU)</title>
    <script type="module" crossorigin src="./assets/index-CqLSOFfS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-rXv5x1TQ.css">
  </head>
  <body>
    <!-- Canvas onde a GPU desenha. Todo o render acontece aqui. -->
    <canvas id="gpu-canvas"></canvas>

    <!-- Flash vermelho ao levar dano. -->
    <div id="damage-flash"></div>

    <!-- Mira central (visível durante o jogo). -->
    <div id="crosshair" class="hidden"></div>

    <!-- Tela de Game Over. -->
    <div id="gameover" class="hidden">
      <h1>VOCÊ MORREU</h1>
      <p>Clique para tentar novamente</p>
    </div>

    <!-- Dica de controles (some ao travar o mouse). -->
    <div id="hint">
      CLIQUE PARA JOGAR<br />
      <span>WASD para mover · mouse para olhar · clique para atirar · ESC para sair</span>
    </div>

    <!-- Mensagem exibida caso o navegador não suporte WebGPU. -->
    <div id="fatal" class="hidden"></div>

    <!-- Ponto de entrada da aplicação (módulo ES). -->
  </body>
</html>
